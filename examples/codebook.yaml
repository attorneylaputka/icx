# Laputka Law Office ICX codebook.
#
# Editor: ICOM owns edits to this file and to examples/index.yaml.
# Approver: MARIAG (Maria G, chief of staff) approves changes. She is the
# only assistant who speaks with the attorney.
#
# A code never carries a client, a matter, a company name, or an exact value
# (a date, an amount, a phone number, an ID). Those stay in other message fields.
# A topic with no code yet is sent as x.<word>; ICOM files it on the next review.
#
# Finance segments stay neutral. The message company field selects the
# comptroller. Comptroller ids under org.agent.cfo are owner addresses only.
#
# Owner ids are uppercase, 6 characters or fewer. The owner of the longest
# matching prefix receives a message unless it is addressed to someone else.
# No code has been retired yet. A retired code is a tombstone and is never reused.
icx:
  version: 1.0.0
  classes:
    - {code: org, name: "assistants, rules, protocol", owner: MARIAG}
    - {code: pr,  name: "client services", owner: MARIAG}
    - {code: sys, name: "systems and platforms", owner: CTO}
    - {code: ops, name: "process and delivery", owner: ICOM}
    - {code: mk,  name: "marketing", owner: MARIAG}
    - {code: fin, name: "finance", owner: CFO}
    - {code: lg,  name: "legal practice and compliance", owner: MARIAG}
    - {code: rs,  name: "research", owner: MARIAG}
    - {code: dt,  name: "data and reporting", owner: CTO}
    - {code: x,   name: "unclassed; send as x.<word> and reclassify within 7 days", owner: ICOM}
  codes:
    - {code: org.proto, name: "communication protocol", owner: ICOM}
    - {code: org.rule, name: "standing rules", owner: MARIAG}
    - {code: org.rule.apprv, name: "no payment without attorney approval", owner: MARIAG}
    - {code: org.agent, name: "assistant roster", owner: MARIAG}
    - {code: org.agent.mariag, name: "Maria G, chief of staff, codebook approver", owner: MARIAG}
    - {code: org.agent.jen, name: "Jen, calendar and email", owner: JEN}
    - {code: org.agent.gaunt, name: "Gauntlet, accuracy and completeness review", owner: GAUNT}
    - {code: org.agent.poll, name: "Inbox Puller, attorney Outlook inbox", owner: POLL}
